<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Silas Yang</title>
  <desc id="desc">AI agents, systems, and high-performance machine learning</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12" />
      <stop offset="0.55" stop-color="#0D1323" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" />
      <stop offset="0.5" stop-color="#818CF8" />
      <stop offset="1" stop-color="#C084FC" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.42" />
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.36" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" />
    </pattern>
    <clipPath id="frame">
      <rect width="1280" height="340" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="340" fill="url(#background)" />
    <rect width="1280" height="340" fill="url(#grid)" />
    <circle cx="1020" cy="90" r="340" fill="url(#glowPurple)" />
    <circle cx="1140" cy="300" r="290" fill="url(#glowBlue)" />

    <g opacity="0.9">
      <circle cx="1050" cy="170" r="104" fill="none" stroke="url(#accent)" stroke-width="2" />
      <circle cx="1050" cy="170" r="73" fill="none" stroke="#FFFFFF" stroke-opacity="0.13" />
      <path d="M987 179l33 33 94-94" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="987" cy="179" r="6" fill="#38BDF8" />
      <circle cx="1114" cy="118" r="6" fill="#C084FC" />
    </g>

    <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <rect x="72" y="56" width="210" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="92" cy="73" r="5" fill="#34D399" />
      <text x="108" y="78" fill="#CBD5E1" font-size="14" font-weight="600" letter-spacing="1.2">BUILDING IN PUBLIC</text>

      <text x="70" y="174" fill="#F8FAFC" font-size="72" font-weight="800" letter-spacing="-2">SILAS YANG</text>
      <rect x="72" y="196" width="410" height="5" rx="2.5" fill="url(#accent)" />
      <text x="72" y="242" fill="#CBD5E1" font-size="23" font-weight="500">AI agents · systems · high-performance ML</text>
      <text x="72" y="286" fill="#94A3B8" font-size="17">Build useful things. Learn the hard parts.</text>
    </g>
